name: Build & Publish Docker Images

on:
  push:
    tags:
      - 'v*'   # v1.0.0, v1.0.0-beta 등 v로 시작하는 태그 push 시 자동 실행

permissions:
  contents: write  # GitHub Release 생성 권한

jobs:
  # ── Docker 이미지 빌드 및 Docker Hub 배포 (backend + frontend) ──────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker Buildx 설정 (멀티 플랫폼 빌드용)
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: backend 이미지 태그 및 메타데이터 생성
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/study-dashboard-backend
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: backend 빌드 및 Docker Hub 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          platforms: linux/amd64,linux/arm64   # Intel + Apple Silicon 대응
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: frontend 이미지 태그 및 메타데이터 생성
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/study-dashboard-frontend
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: frontend 빌드 및 Docker Hub 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          platforms: linux/amd64,linux/arm64   # Intel + Apple Silicon 대응
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ── GitHub Release 생성 ────────────────────────────────────────────
  release:
    name: GitHub Release
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: CHANGELOG에서 현재 버전 패치노트 추출
        id: changelog
        run: |
          TAG="${{ github.ref_name }}"
          NOTES=$(awk "/^## \[${TAG}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 기존 Release asset 삭제
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases/tags/${{ github.ref_name }} --jq '.id' 2>/dev/null || echo "")
          if [ -n "$RELEASE_ID" ]; then
            gh api repos/${{ github.repository }}/releases/${RELEASE_ID}/assets --jq '.[].id' | \
              xargs -I{} gh api --method DELETE repos/${{ github.repository }}/releases/assets/{} || true
          fi

      - name: GitHub Release 생성
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          overwrite_files: true
          body: |
            # ${{ github.ref_name }}

            숭실대학교 Canvas Learning X 강의를 백그라운드로 재생(출석 처리)하거나
            다운로드/변환/AI 요약할 수 있는 웹 대시보드.

            ---

            ## 패치노트

            ${{ steps.changelog.outputs.notes }}

            ---

            ## 설치 및 실행

            자세한 설치·실행 방법은 [README](https://github.com/ssucream/study-dashboard/blob/main/README-ko_kr.md#설치-및-실행)를 참고하세요.

            ---

            ## Docker Hub

            ```bash
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/study-dashboard-backend:${{ github.ref_name }}
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/study-dashboard-frontend:${{ github.ref_name }}
            ```

          files: |
            docker-compose.yml
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          draft: false
